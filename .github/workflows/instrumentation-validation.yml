name: Instrumented Policy Validation

on:
  push:
    branches:
      - assistant/instrumentation-v3
  workflow_dispatch:

jobs:
  validate:
    name: Validate R29-C policy instrumentation
    runs-on: ubuntu-latest
    env:
      BACKTEST_CSV: ${{ github.workspace }}/loops/r23c_phase3_validation/window_01/ticks_live.csv
      BACKTEST_OUT: ${{ github.workspace }}/build/ci-replay.csv
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/validation_engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install -r scripts/ci/requirements-tests.txt

      - name: Verify instrumentation registry
        run: python scripts/research/instrumented_policy_registry.py

      - name: Run instrumentation Python gate
        run: python scripts/research/instrumentation_python_gate.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run clean multimodule tests and build APK
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache

      - name: Summarize Gradle XML results
        run: |
          python - <<'PY'
          from scripts.ci.verify_clean_worktree import parse_gradle_test_results
          result = parse_gradle_test_results('.', multi_module=True)
          print(result)
          assert result['failures'] == 0
          assert result['errors'] == 0
          assert result['skipped'] == 0
          assert result['total_tests'] >= 712
          PY

      - name: Generate artifact identity manifest
        run: python scripts/research/instrumented_artifact_manifest.py

      - name: Verify Android runtime code identity source
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          grep -R 'GIT_SHA' app/build/generated/source/buildConfig/debug
          cat build/instrumented-artifact-manifest.json

      - name: Upload instrumented APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeDraw-instrumented-policy-v1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/instrumented-artifact-manifest.json
          if-no-files-found: error

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TradeDraw-instrumentation-validation
          path: |
            **/build/test-results/**/*.xml
            build/ci-replay.csv
            loops/r29c/evidence/strategy_registry_instrumented_policy_v1.json
            loops/r29c/INSTRUMENTED_POLICY_V1.md
            build/instrumented-artifact-manifest.json
          if-no-files-found: warn
