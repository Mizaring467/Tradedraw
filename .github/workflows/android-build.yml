name: Build APK

on:
  push:
    branches: [main, r10-night]
  pull_request:
    branches: [main, r10-night]
  workflow_dispatch:

# Push and PR events for the same head branch share one slot. The later event
# cancels the duplicate runner instead of compiling the same SHA twice.
concurrency:
  group: tradedraw-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    env:
      BACKTEST_CSV: ${{ github.workspace }}/loops/r23c_phase3_validation/window_01/ticks_live.csv
      BACKTEST_OUT: ${{ github.workspace }}/build/ci-replay.csv
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/validation_engine
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Clasificar alcance del cambio
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            before="${{ github.event.before }}"
            if [[ "${{ github.event.action }}" == "synchronize" && -n "$before" && "$before" != "$zero" ]]; then
              base="$before"
            else
              base="${{ github.event.pull_request.base.sha }}"
            fi
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "$zero" ]]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          git diff --name-only "$base" HEAD > ci-changed-files.txt
          cat ci-changed-files.txt
          python3 .github/ci_change_classify.py \
            --paths-file ci-changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Configurar JDK 17
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias de pruebas Python
        if: steps.changes.outputs.heavy == 'true'
        run: python -m pip install -r scripts/ci/requirements-tests.txt

      - name: Ejecutar pruebas Python
        if: steps.changes.outputs.heavy == 'true'
        run: python -m unittest discover -s tests

      - name: Cache de Gradle
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Otorgar permisos al wrapper
        if: steps.changes.outputs.heavy == 'true'
        run: chmod +x gradlew

      - name: Validar módulos y compilar APK Debug
        if: steps.changes.outputs.heavy == 'true'
        run: ./gradlew testDebugUnitTest :core:test :simulation:test assembleDebug --no-daemon --no-configuration-cache

      - name: Confirmar fast-path documental
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Cambio exclusivamente Markdown; se omite build Android/Python sin relajar CI de código."

      - name: Subir APK como artefacto
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TradeDraw-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir evidencia de pruebas y replay
        if: ${{ always() && steps.changes.outputs.heavy == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradeDraw-validation
          path: |
            **/build/test-results/**/*.xml
            build/ci-replay.csv
            build/adaptive_blocks_replay.csv
          if-no-files-found: warn
