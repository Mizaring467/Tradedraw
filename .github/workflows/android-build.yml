name: Build APK

on:
  push:
    branches: [main, r10-night]
  pull_request:
    branches: [main, r10-night]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    env:
      BACKTEST_CSV: ${{ github.workspace }}/loops/r23c_phase3_validation/window_01/ticks_live.csv
      BACKTEST_OUT: ${{ github.workspace }}/build/ci-replay.csv
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/validation_engine
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias de pruebas Python
        run: python -m pip install -r scripts/ci/requirements-tests.txt

      - name: Ejecutar pruebas Python
        run: python -m unittest discover -s tests

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Otorgar permisos al wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias Android
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TradeDraw-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir evidencia de pruebas y replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TradeDraw-validation
          path: |
            **/build/test-results/**/*.xml
            build/ci-replay.csv
            build/adaptive_blocks_replay.csv
          if-no-files-found: warn
